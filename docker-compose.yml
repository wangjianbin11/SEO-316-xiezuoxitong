# ============================================
# SEO Content Generator - Docker Compose
# ============================================

services:
  seo-gen:
    build: .
    container_name: seo-content-generator
    volumes:
      # 挂载配置文件
      - ./.env:/app/.env
      # 挂载输出目录
      - ./outputs:/app/outputs
      # 挂载知识库目录（可选，用于本地更新知识库）
      - ./config/knowledge:/app/config/knowledge
    environment:
      - TZ=Asia/Shanghai
    # 如果需要定期运行任务，可以使用以下配置
    # restart: unless-stopped
    # command: /bin/sh -c "while true; do sleep 86400; done"

  # 可选：添加 Nginx 服务用于查看输出
  # nginx:
  #   image: nginx:alpine
  #   container_name: seo-gen-nginx
  #   ports:
  #     - "8080:80"
  #   volumes:
  #     - ./outputs:/usr/share/nginx/html
  #   depends_on:
  #     - seo-gen

volumes:
  outputs:
