[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-content-generator"
version = "2.0.0"
description = "AI-powered SEO content generator with ASG knowledge base, content classification, and WordPress integration"
readme = "README.md"
authors = [
    {name = "ASG", email = "contact@asgdropshipping.com"}
]
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "markdownify>=0.11.0",
    "aiohttp>=3.9.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "loguru>=0.7.0",
    "customtkinter>=5.0.0",
]

[project.optional-dependencies]
feishu = [
    "lark-oapi>=1.2.0",
]
google-drive = [
    "google-api-python-client>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.1.0",
]
all = [
    "seo-content-generator[feishu,google-drive]",
]

[project.scripts]
seo-gen = "seo_gen.main:app"

[project.urls]
Homepage = "https://github.com/asgdropshipping/seo-content-generator"
Repository = "https://github.com/asgdropshipping/seo-content-generator"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"seo_gen" = ["prompts/*.txt", "config/*.json"]
